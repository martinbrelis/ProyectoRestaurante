<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://java.sun.com/jsf/facelets"
    xmlns:f="http://java.sun.com/jsf/core"
    xmlns:h="http://java.sun.com/jsf/html"
    xmlns:b="http://bootsfaces.net/ui">
    
    <h:head>
        <ui:include src="/pages/commons/commons.xhtml"></ui:include>
    </h:head>
    
    <h:body>
    
    <ui:include src="/pages/commons/navbar.xhtml"></ui:include>	
           
	<b:container>
		<b:row>
			<h:form id="formAdminAlimentos">
				<b:growl id="msgValidaciones" placementFrom="top" showDetail="true" showSummary="true" escape="true">
    		
    			</b:growl>
			
				<b:panel title="Administración de Alimentos" look="primary" collapsible="false">
		    		<b:commandButton look="primary" id="btnAgregar" value="Agregar" size="lg" style="margin-bottom: 20px" ajax="true" oncomplete="$('#amodal').modal('show')" 
		    						 onclick="ajax:adminAlimentosController.inicializarComponentes()" update="formRegistroAlimento"></b:commandButton>
		    		
		    		<b:dataTable id="tblAlimentos" style="width: 100%" excel="true" csv="true" pdf="true" value="#{adminAlimentosController.alimentos}" var="alimento" responsive="true">
					    <b:dataTableColumn label="Imagen" width="10%">
					    	<b:image value="/resources/images/alimentos/#{alimento.imagen}" rendered="#{alimento.imagen != null}" style="width: 100%"></b:image>
					    	<b:image value="/resources/images/no-image.png" rendered="#{alimento.imagen == null}" style="width: 100%"></b:image>					    	
					    </b:dataTableColumn>
					    
					    <b:dataTableColumn label="Nombre">
					    	<h:outputText value="#{alimento.nombre}"></h:outputText>
					    </b:dataTableColumn>
					    
					    <b:dataTableColumn label="Descripción">
					    	<h:outputText value="#{alimento.descripcion}"></h:outputText>
					    </b:dataTableColumn>
					    
					    <b:dataTableColumn label="Precio Unitario">
					    	<h:outputText value="#{alimento.precio}"></h:outputText>
					    </b:dataTableColumn>
					    
					    <b:dataTableColumn label="Descuento">
					    	<h:outputText value="#{alimento.descuento}"></h:outputText>
					    </b:dataTableColumn>
					    
					    <b:dataTableColumn label="Tipo de Alimento">
					    	<h:outputText value="#{alimento.tipoAlimento.descripcion}"></h:outputText>
					    </b:dataTableColumn>
					    
					    <b:dataTableColumn label="Fecha de Creación">
					    	<h:outputText value="#{alimento.fechaCreacion}" converter="#{localDateTimeConverter}"></h:outputText>
					    </b:dataTableColumn>
					    
					    <b:dataTableColumn label="Fecha de Modificación">
							<h:outputText value="#{alimento.fechaModificacion}" converter="#{localDateTimeConverter}"></h:outputText>
					    </b:dataTableColumn>
					    
					    <b:dataTableColumn label="Estatus">
					    	<b:label value="Habilitado" rendered="#{alimento.estatus}" severity="success"></b:label>
					    	<b:label value="Deshabilitado" rendered="#{!alimento.estatus}" severity="danger"></b:label>
					    </b:dataTableColumn>
					    
					    <b:dataTableColumn label="Actualizar">
					    	<b:commandButton icon="pencil" look="success" ajax="true" size="sm" update="formRegistroAlimento" oncomplete="$('#amodal').modal('show')" onclick="ajax:adminAlimentosController.cargarInformacionModal(alimento)"></b:commandButton>	
					    </b:dataTableColumn>
					  </b:dataTable>
		    	</b:panel>
			</h:form>
			
			<b:modal id="amodal" title="Registro de Alimento" styleClass="modalPseudoClass">
			
				<b:form id="formRegistroAlimento" enctype="multipart/form-data">
				
					<b:inputText id="txtNombre" label="Nombre: " value="#{adminAlimentosController.alimento.nombre}" required="true" requiredMessage="El nombre es requerido" colMd="12"></b:inputText>
					
					<h:outputText value="Imagen: " style="font-weight: bold" class="col-md-12"></h:outputText>
					<h:inputFile id="fileImagen" value="#{adminAlimentosController.archivoSeleccionado}" class="col-md-12">
					
					</h:inputFile>
					
					<b:inputTextarea id="txtDescripcion" label="Descripción: " value="#{adminAlimentosController.alimento.descripcion}" colMd="12"></b:inputTextarea>
					
					<b:selectOneMenu id="cboTipoAlimento" value="#{adminAlimentosController.alimento.tipoAlimento.idTipoAlimento}" colMd="6" span="12" required="true" requiredMessage="El tipo de alimento es requerido" label="Tipo de Alimento">
						<f:selectItem itemValue="" itemLabel="--Seleccione--"></f:selectItem>
						<f:selectItems value="#{adminAlimentosController.tiposAlimentos}" var="tipoAlimento" 
									   itemValue="#{tipoAlimento.idTipoAlimento}" itemLabel="#{tipoAlimento.descripcion}"></f:selectItems>
					</b:selectOneMenu>
					
					<b:inputText id="txtDescuento" label="Descuento: " colMd="6" value="#{adminAlimentosController.alimento.descuento}"></b:inputText>
					
					<b:inputText id="txtPrecio" label="Precio: " colMd="6" required="true" requiredMessage="El precio es requerido." value="#{adminAlimentosController.alimento.precio}">
						<f:facet name="prepend">
							<h:outputText value="$"></h:outputText>
						</f:facet>
					</b:inputText>
					
					<b:switch id="swEstatus" value="#{adminAlimentosController.alimento.estatus}" offText="Habilitar" onText="Deshabilitar" 
							  label="Estatus: " offColor="success" onColor="danger" colMd="6" span="12" rendered="#{adminAlimentosController.alimento.idAlimento != null}"></b:switch>
					

					<b:row style="margin-bottom: 10px; margin-top: 10px">
						<b:column colMd="6">
							<b:button id="btnCancelar" value="Cancelar" largeScreen="full-width" look="danger" dismiss="modal" onclick="return false;"></b:button>
						</b:column>

						<b:column colMd="6">
							<b:commandButton id="btnGuardar" largeScreen="full-width" value="Guardar" look="success" update="formRegistroAlimento, formAdminAlimentos:tblAlimentos, formAdminAlimentos:msgValidaciones" oncomplete="if(!validationFailed) { $('#amodal').modal('hide') }" onclick="ajax:adminAlimentosController.guardar()" rendered="#{adminAlimentosController.alimento.idAlimento == null}"></b:commandButton>
							<b:commandButton id="btnActualizar" largeScreen="full-width" value="Actualizar" look="success" update="formRegistroAlimento, formAdminAlimentos:tblAlimentos, formAdminAlimentos:msgValidaciones" oncomplete="if(!validationFailed) { $('#amodal').modal('hide') }" onclick="ajax:adminAlimentosController.actualizar()" rendered="#{adminAlimentosController.alimento.idAlimento != null}"></b:commandButton>
						</b:column>
					</b:row>
					
					<b:fetchBeanInfos></b:fetchBeanInfos>
					<b:messages></b:messages>
				</b:form>
			
			</b:modal>			
		</b:row>
	</b:container>
	
    </h:body>
</html>
